
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<link rel="icon" type="image/svg+xml" sizes="any" href="%sveltekit.assets%/favicon.svg?v=4" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.svg?v=4" />

		<!-- Base visual global: impede flashes brancos e mantém scroll normal fora do mapa. -->
		<meta name="theme-color" content="#0b0b0e" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				min-height: 100%;
				background-color: #0b0b0e;
				color: #e0e0e0;
				font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			}
			html { color-scheme: dark; }
			body { min-height: 100dvh; }
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
